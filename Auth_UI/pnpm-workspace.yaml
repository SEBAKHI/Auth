packages:
  - apps/*
  - packages/*

# @hookform/resolvers imports zod without declaring it as a peer, relying on
# a hoisted layout; hoist zod to the virtual-store root so it can resolve it.
publicHoistPattern:
  - zod

allowBuilds:
  esbuild: true
  msw: false

patchedDependencies:
  react-style-singleton@2.2.3: patches/react-style-singleton@2.2.3.patch
  style-mod@4.1.3: patches/style-mod@4.1.3.patch
